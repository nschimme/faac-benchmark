name: 'FAAC Benchmark Report'
description: 'Consolidates benchmark results and generates a report.'
inputs:
  results-path:
    description: 'Path to the directory containing result JSON files'
    required: true
  base-sha:
    description: 'Baseline commit SHA (Optional, will be pulled from result JSON if available)'
    required: false
  cand-sha:
    description: 'Candidate commit SHA (Optional, will be pulled from result JSON if available)'
    required: false
  summary-only:
    description: 'Generate only the high-signal summary'
    required: false
    default: 'false'
  report-output:
    description: 'Path to write the report file'
    required: false
    default: 'report.md'
  summary-output:
    description: 'Path to write the summary file'
    required: false
    default: 'summary.md'
  cases-output:
    description: 'Path to write individual test cases report (optional)'
    required: false
    default: ''
  strict-decode:
    description: 'Treat candidate decode validation failures as hard regressions'
    required: false
    default: 'false'
  gates:
    description: 'Comma-separated gate names allowed to fail (mos, footprint, throughput, bd_rate)'
    required: false
    default: ''
  footprint-allow:
    description: 'Accept up to BYTES of code footprint growth without failing'
    required: false
    default: '0'
  skip-graphs:
    description: 'Skip generating Mermaid.js charts in the report'
    required: false
    default: 'false'
  fail-on-regression:
    description: 'Exit with non-zero code if a regression is detected'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      shell: bash
      run: |
        pip install -r ${{ github.action_path }}/../requirements.txt

    - name: Generate Report
      shell: bash
      run: |
        ARGS="${{ inputs.results-path }} --output ${{ inputs.report-output }} --summary-output ${{ inputs.summary-output }}"
        if [ -n "${{ inputs.base-sha }}" ]; then ARGS="$ARGS --base-sha ${{ inputs.base-sha }}"; fi
        if [ -n "${{ inputs.cand-sha }}" ]; then ARGS="$ARGS --cand-sha ${{ inputs.cand-sha }}"; fi
        if [ -n "${{ inputs.cases-output }}" ]; then ARGS="$ARGS --cases-output ${{ inputs.cases-output }}"; fi
        if [ "${{ inputs.summary-only }}" == "true" ]; then ARGS="$ARGS --summary-only"; fi
        if [ "${{ inputs.strict-decode }}" == "true" ]; then ARGS="$ARGS --strict-decode"; fi
        if [ -n "${{ inputs.gates }}" ]; then ARGS="$ARGS --gates ${{ inputs.gates }}"; fi
        if [ -n "${{ inputs.footprint-allow }}" ] && [ "${{ inputs.footprint-allow }}" != "0" ]; then ARGS="$ARGS --footprint-allow ${{ inputs.footprint-allow }}"; fi
        if [ "${{ inputs.skip-graphs }}" == "true" ]; then ARGS="$ARGS --skip-graphs"; fi
        
        # Run report generation, but don't fail immediately so we can post the summary
        python3 ${{ github.action_path }}/../compare_results.py $ARGS || EXIT_CODE=$?

        # Also append to the GitHub Step Summary for visibility
        if [ -n "${{ inputs.cases-output }}" ]; then
          echo "<details><summary><b>📊 Benchmark Comparison Report (${{ inputs.report-output }})</b></summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "${{ inputs.report-output }}" ]; then
            cat "${{ inputs.report-output }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "${{ inputs.cases-output }}" ]; then
            cat "${{ inputs.cases-output }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
        else
          if [ -f "${{ inputs.report-output }}" ]; then
            cat "${{ inputs.report-output }}" >> $GITHUB_STEP_SUMMARY
          fi
        fi

        if [ "${{ inputs.fail-on-regression }}" == "true" ]; then
          exit ${EXIT_CODE:-0}
        else
          exit 0
        fi
