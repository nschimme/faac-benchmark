name: Test Suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y faac fdkaac ffmpeg valgrind cmake

      - name: Cache FAAD2
        uses: actions/cache@v6
        with:
          path: bin/faad*
          key: faad2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_faad2.sh') }}

      - name: Build FAAD2
        run: echo "FAAD_BIN=$(./scripts/build_faad2.sh)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        run: |
          python3 -m pytest tests/ -v
