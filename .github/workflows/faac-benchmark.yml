name: FAAC Benchmark

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        rate_control: [abr, vbr]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y faac fdkaac ffmpeg valgrind meson ninja-build cmake

      - name: Cache FAAD2 reference
        uses: actions/cache@v6
        with:
          path: bin/faad2-2.11.4*
          key: faad2-2.11.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_faad2.sh') }}

      - name: Build FAAD2 reference
        run: ./scripts/build_faad2.sh

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup Datasets
        run: |
          python3 setup_datasets.py

      - name: Build FAAC HEAD from Source
        run: |
          git clone https://github.com/FreewareAdvancedAudio/faac.git ../faac
          cd ../faac
          meson setup build --buildtype=release
          ninja -C build

      - name: Run Benchmark (Baseline - APT Legacy FAAC)
        uses: ./
        with:
          faac-bin: /usr/bin/faac
          faad-bin: ${{ github.workspace }}/../faac/build/frontend/faad
          faad-ref-bin: ${{ github.workspace }}/bin/faad2-2.11.4
          run-name: faac_${{ matrix.rate_control }}_base
          output-json: results/faac_${{ matrix.rate_control }}_base.json
          rate-control: ${{ matrix.rate_control }}
          gate: ${{ github.event_name != 'workflow_dispatch' }}

      - name: Run Benchmark (Candidate - FAAC HEAD)
        uses: ./
        with:
          faac-bin: ${{ github.workspace }}/../faac/build/frontend/faac
          faad-bin: ${{ github.workspace }}/../faac/build/frontend/faad
          faad-ref-bin: ${{ github.workspace }}/bin/faad2-2.11.4
          libfaac-so: ${{ github.workspace }}/../faac/build/libfaac/libfaac.so
          run-name: faac_${{ matrix.rate_control }}_cand
          output-json: results/faac_${{ matrix.rate_control }}_cand.json
          baseline-json: results/faac_${{ matrix.rate_control }}_base.json
          rate-control: ${{ matrix.rate_control }}
          gate: ${{ github.event_name != 'workflow_dispatch' }}

      - name: Generate Per-Rate Control Comparison Report
        uses: ./report
        with:
          results-path: results
          report-output: report_${{ matrix.rate_control }}.md
          summary-output: summary_${{ matrix.rate_control }}.md
          cases-output: cases_${{ matrix.rate_control }}.md
          fail-on-regression: false
          summary-only: false

      - name: Upload Results Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.rate_control }}
          path: |
            results/faac_${{ matrix.rate_control }}_*.json
            report_${{ matrix.rate_control }}.md
            cases_${{ matrix.rate_control }}.md

  consolidated-report:
    needs: benchmark
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Download Benchmark Results
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - name: Generate Consolidated Comparison Report
        uses: ./report
        with:
          results-path: results
          report-output: faac_benchmark_report.md
          fail-on-regression: false

      - name: Upload Consolidated Report Artifact
        uses: actions/upload-artifact@v7
        with:
          name: faac-benchmark-consolidated-report
          path: |
            results/*.json
            faac_benchmark_report.md
            summary.md
