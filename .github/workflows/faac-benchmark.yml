name: FAAC Benchmark

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        rate_control: [abr, vbr]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y faac faad fdkaac ffmpeg valgrind meson ninja-build

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup Datasets
        run: |
          python3 setup_datasets.py

      - name: Build FAAC HEAD from Source
        run: |
          git clone https://github.com/knik0/faac.git ../faac_src
          cd ../faac_src
          meson setup build --buildtype=release
          ninja -C build

      - name: Run Benchmark (Baseline - APT Legacy FAAC)
        run: |
          GATE_FLAG=""
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            GATE_FLAG="--gate"
          fi
          mkdir -p results
          python3 run_benchmark.py "faac_${{ matrix.rate_control }}_base" "results/faac_${{ matrix.rate_control }}_base.json" --encoder-bin "/usr/bin/faac" --encoder-lib "/usr/lib/x86_64-linux-gnu/libfaac.so.0" --rate-control ${{ matrix.rate_control }} $GATE_FLAG

      - name: Run Benchmark (Candidate - FAAC HEAD)
        run: |
          GATE_FLAG=""
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            GATE_FLAG="--gate"
          fi
          FAAC_BIN="$(pwd)/../faac_src/build/frontend/faac"
          FAAC_LIB="$(pwd)/../faac_src/build/libfaac/libfaac.so"
          python3 run_benchmark.py "faac_${{ matrix.rate_control }}_cand" "results/faac_${{ matrix.rate_control }}_cand.json" --encoder-bin "$FAAC_BIN" --encoder-lib "$FAAC_LIB" --rate-control ${{ matrix.rate_control }} $GATE_FLAG

      - name: Generate Per-Rate Control Comparison Report
        uses: ./report
        with:
          results-path: results
          report-output: report_${{ matrix.rate_control }}.md
          summary-output: summary_${{ matrix.rate_control }}.md
          cases-output: cases_${{ matrix.rate_control }}.md
          summary-only: false

      - name: Upload Results Artifact
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.rate_control }}
          path: |
            results/faac_${{ matrix.rate_control }}_*.json
            report_${{ matrix.rate_control }}.md
            cases_${{ matrix.rate_control }}.md

  consolidated-report:
    needs: benchmark
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Download Benchmark Results
        uses: actions/download-artifact@v7
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - name: Generate Consolidated Comparison Report
        uses: ./report
        with:
          results-path: results

      - name: Upload Consolidated Report Artifact
        uses: actions/upload-artifact@v7
        with:
          name: faac-benchmark-consolidated-report
          path: |
            results/*.json
            faac_benchmark_report.md
            summary.md
