name: FAAC Benchmark

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  benchmark-abr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y faac faad fdkaac ffmpeg valgrind meson ninja-build

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup Datasets
        run: |
          python3 setup_datasets.py

      - name: Build FAAC HEAD from Source
        run: |
          git clone https://github.com/knik0/faac.git ../faac_src
          cd ../faac_src
          meson setup build --buildtype=release
          ninja -C build

      - name: Run Benchmark ABR (Baseline - APT Legacy FAAC)
        run: |
          GATE_FLAG=""
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            GATE_FLAG="--gate"
          fi
          mkdir -p results
          python3 run_benchmark.py "faac_abr_base" "results/faac_abr_base.json" --encoder-bin "/usr/bin/faac" --encoder-lib "/usr/lib/x86_64-linux-gnu/libfaac.so.0" --rate-control abr $GATE_FLAG

      - name: Run Benchmark ABR (Candidate - FAAC HEAD)
        run: |
          GATE_FLAG=""
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            GATE_FLAG="--gate"
          fi
          FAAC_BIN="$(pwd)/../faac_src/build/frontend/faac"
          FAAC_LIB="$(pwd)/../faac_src/build/libfaac/libfaac.so"
          python3 run_benchmark.py "faac_abr_cand" "results/faac_abr_cand.json" --encoder-bin "$FAAC_BIN" --encoder-lib "$FAAC_LIB" --rate-control abr $GATE_FLAG

      - name: Render ABR Base Job Summary
        run: |
          python3 render_job_summary.py results/faac_abr_base.json --name "FAAC ABR Baseline" >> $GITHUB_STEP_SUMMARY

      - name: Render ABR Cand Job Summary
        run: |
          python3 render_job_summary.py results/faac_abr_cand.json --name "FAAC ABR Candidate" >> $GITHUB_STEP_SUMMARY

      - name: Upload ABR Results Artifact
        uses: actions/upload-artifact@v7
        with:
          name: abr-results
          path: results/faac_abr_*.json

  benchmark-vbr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y faac faad fdkaac ffmpeg valgrind meson ninja-build

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup Datasets
        run: |
          python3 setup_datasets.py

      - name: Build FAAC HEAD from Source
        run: |
          git clone https://github.com/knik0/faac.git ../faac_src
          cd ../faac_src
          meson setup build --buildtype=release
          ninja -C build

      - name: Run Benchmark VBR (Baseline - APT Legacy FAAC)
        run: |
          GATE_FLAG=""
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            GATE_FLAG="--gate"
          fi
          mkdir -p results
          python3 run_benchmark.py "faac_vbr_base" "results/faac_vbr_base.json" --encoder-bin "/usr/bin/faac" --encoder-lib "/usr/lib/x86_64-linux-gnu/libfaac.so.0" --rate-control vbr $GATE_FLAG

      - name: Run Benchmark VBR (Candidate - FAAC HEAD)
        run: |
          GATE_FLAG=""
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            GATE_FLAG="--gate"
          fi
          FAAC_BIN="$(pwd)/../faac_src/build/frontend/faac"
          FAAC_LIB="$(pwd)/../faac_src/build/libfaac/libfaac.so"
          python3 run_benchmark.py "faac_vbr_cand" "results/faac_vbr_cand.json" --encoder-bin "$FAAC_BIN" --encoder-lib "$FAAC_LIB" --rate-control vbr $GATE_FLAG

      - name: Render VBR Base Job Summary
        run: |
          python3 render_job_summary.py results/faac_vbr_base.json --name "FAAC VBR Baseline" >> $GITHUB_STEP_SUMMARY

      - name: Render VBR Cand Job Summary
        run: |
          python3 render_job_summary.py results/faac_vbr_cand.json --name "FAAC VBR Candidate" >> $GITHUB_STEP_SUMMARY

      - name: Upload VBR Results Artifact
        uses: actions/upload-artifact@v7
        with:
          name: vbr-results
          path: results/faac_vbr_*.json

  consolidated-report:
    needs: [benchmark-abr, benchmark-vbr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Download ABR Results
        uses: actions/download-artifact@v7
        with:
          name: abr-results
          path: results

      - name: Download VBR Results
        uses: actions/download-artifact@v7
        with:
          name: vbr-results
          path: results

      - name: Generate Consolidated Comparison Report
        run: |
          python3 compare_results.py results/ --output faac_benchmark_report.md --summary-output summary.md || true

      - name: Render Consolidated Step Summary
        run: |
          if [ -f faac_benchmark_report.md ]; then
            cat faac_benchmark_report.md >> $GITHUB_STEP_SUMMARY
          elif [ -f summary.md ]; then
            cat summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Consolidated Report Artifact
        uses: actions/upload-artifact@v7
        with:
          name: faac-benchmark-consolidated-report
          path: |
            results/*.json
            faac_benchmark_report.md
            summary.md
