name: FAAC Benchmark

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  faac-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y faad fdkaac ffmpeg valgrind meson ninja-build

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup Datasets
        run: |
          python3 setup_datasets.py

      - name: Build FAAC from Source
        run: |
          git clone https://github.com/knik0/faac.git ../faac_src
          cd ../faac_src
          meson setup build --buildtype=release
          ninja -C build

      - name: Run Standard FAAC Benchmark
        run: |
          GATE_FLAG=""
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            GATE_FLAG="--gate"
          fi

          FAAC_BIN="$(pwd)/../faac_src/build/frontend/faac"
          FAAC_LIB="$(pwd)/../faac_src/build/libfaac/libfaac.so"

          python3 run_benchmark.py "$FAAC_BIN" "$FAAC_LIB" "faac-head" "results/faac_benchmark.json" $GATE_FLAG

      - name: Render Job Summary
        run: |
          python3 render_job_summary.py results/faac_benchmark.json --name "faac-head" >> $GITHUB_STEP_SUMMARY

      - name: Upload FAAC Benchmark Results Artifact
        uses: actions/upload-artifact@v7
        with:
          name: faac-benchmark-results
          path: results/faac_benchmark.json
