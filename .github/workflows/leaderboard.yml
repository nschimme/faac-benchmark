name: Multi-Codec Leaderboard

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  codec-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y faac faad fdkaac ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup Datasets
        run: |
          python3 setup_datasets.py

      - name: Build Helix AAC Decoder
        run: |
          ./scripts/build_helix_aac.sh

      - name: Run Codec Leaderboard
        run: |
          # Use --gate for PRs and push to save time/resources.
          # Run full benchmark for manual triggers.
          GATE_FLAG=""
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            GATE_FLAG="--gate"
          fi

          # Zimtohrli is installed via requirements.txt and acts as default perceptual engine.
          python3 compare_codecs.py $GATE_FLAG --mode both --output leaderboard_ci.md

      - name: Upload Leaderboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codec-leaderboard
          path: leaderboard_ci.md

      - name: Display Leaderboard in Summary
        run: cat leaderboard_ci.md >> $GITHUB_STEP_SUMMARY
